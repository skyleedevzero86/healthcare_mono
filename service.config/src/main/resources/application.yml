server:
  port: 8888

spring:
  application:
    name: service.config
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      server:
        encrypt:
          enabled: true
        git:
          uri: file:///D:/intel/2005/healthcare_mono/
          search-paths: gits
          default-label: main
        bootstrap: true
  security:
    user:
      name: config-admin
      password: ${CONFIG_ADMIN_PASSWORD:healthcare_config_2025}

management:
  endpoints:
    web:
      exposure:
        include: health,bus-refresh
  tracing:
    sampling:
      probability: 1.0

spring:
  sleuth:
    zipkin:
      base-url: http://localhost:9411
    sampler:
      probability: 1.0