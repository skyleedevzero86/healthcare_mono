server:
  port: 8888

spring:
  application:
    name: service.config
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    config:
      server:
        encrypt:
          enabled: true
        git:
          uri: file:///D:/intel/2005/healthcare_mono/
          search-paths: gits
          default-label: main
        bootstrap: true
  security:
    user:
      name: config-admin
      password: ${CONFIG_ADMIN_PASSWORD:healthcare_config_2025}
  sleuth:
    zipkin:
      base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
    sampler:
      probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,bus-refresh
  tracing:
    sampling:
      probability: 1.0