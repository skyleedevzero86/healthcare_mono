llm:
  enabled: true
  provider: router
  routing:
    default: llama-cpp
  llama-cpp:
    server-url: ${LLAMA_CPP_SERVER_URL:http://localhost:8080}
    timeout: 60000
    max-retries: 3
  glm47:
    server-url: ${GLM47_SERVER_URL:http://localhost:8081}
    timeout: 60000
    max-retries: 3
  km-bert:
    server-url: ${KM_BERT_SERVER_URL:http://localhost:8082}
    timeout: 60000
    max-retries: 3
  cache:
    enabled: true
    ttl: 1800
  rate-limit:
    enabled: true
    requests-per-minute: 60

logging:
  level:
    com.sleekydz86.service.llm: INFO
    org.springframework.web: INFO
    org.springframework.cloud: INFO

