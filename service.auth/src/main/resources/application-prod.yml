server:
  ssl:
    enabled: true
    key-store: classpath:keystore/healthcare-keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:healthcare_ssl_2025}
    key-store-type: PKCS12
    key-alias: healthcare
    trust-store: classpath:keystore/healthcare-truststore.p12
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:healthcare_trust_2025}
    trust-store-type: PKCS12
  port: 8443
  http2:
    enabled: true

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthcare_auth}?ssl=true&sslmode=require
    username: ${DB_USERNAME:healthcare_auth_user}
    password: ${DB_PASSWORD:healthcare_auth_pass}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        ssl: true
        sslmode: require
        sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory

logging:
  level:
    root: WARN
    com.sleekydz86: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

debug: false

token:
  secret: ${JWT_SECRET:healthcare-lifelink-jwt-secret-key-for-authentication-service-2025-prod}
  access-expired-time: 1800000
  refresh-expired-time: 604800000

encryption:
  aes:
    key: ${AES_ENCRYPTION_KEY}
    iv: ${AES_IV}
  jwt:
    secret: ${JWT_SECRET}