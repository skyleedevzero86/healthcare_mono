server:
  port: 8086
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10

spring:
  application:
    name: service.llm
  profiles:
    active: dev
    include: common

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,loggers,circuitbreakers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

spring:
  sleuth:
    zipkin:
      base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
    sampler:
      probability: 1.0

logging:
  config: classpath:log4j2-spring.xml

info:
  app:
    name: Healthcare LLM Service
    description: Qwen2.5-7B-Instruct-GGUF based LLM Service for Healthcare Platform
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}

llm:
  enabled: ${LLM_ENABLED:true}
  provider: ${LLM_PROVIDER:llama-cpp}
  llama-cpp:
    server-url: ${LLAMA_CPP_SERVER_URL:http://localhost:8080}
    timeout: ${LLAMA_CPP_TIMEOUT:60000}
    max-retries: ${LLAMA_CPP_MAX_RETRIES:3}
    model:
      name: ${LLM_MODEL_NAME:qwen2.5-7b-instruct-q4_k_m}
      context-size: ${LLM_CONTEXT_SIZE:16384}
      max-tokens: ${LLM_MAX_TOKENS:2048}
      temperature: ${LLM_TEMPERATURE:0.7}
      top-p: ${LLM_TOP_P:0.9}
      top-k: ${LLM_TOP_K:40}
      repeat-penalty: ${LLM_REPEAT_PENALTY:1.1}
  cache:
    enabled: ${LLM_CACHE_ENABLED:true}
    ttl: ${LLM_CACHE_TTL:3600}
  rate-limit:
    enabled: ${LLM_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${LLM_RATE_LIMIT_RPM:30}
    requests-per-hour: ${LLM_RATE_LIMIT_RPH:500}

