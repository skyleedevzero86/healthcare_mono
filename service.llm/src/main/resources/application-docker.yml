# Docker 환경용 설정

llm:
  enabled: ${LLM_ENABLED:true}
  provider: ${LLM_PROVIDER:router}
  routing:
    chat: ${LLM_CHAT_PROVIDER:glm47}
    healthcare: ${LLM_HEALTHCARE_PROVIDER:glm47}
    default-provider: ${LLM_DEFAULT_PROVIDER:llama-cpp}
  llama-cpp:
    server-url: ${LLAMA_CPP_SERVER_URL:http://llama-cpp-server:8090}
    timeout: ${LLAMA_CPP_TIMEOUT:60000}
    max-retries: ${LLAMA_CPP_MAX_RETRIES:3}
    model:
      name: ${LLM_MODEL_NAME:qwen2.5-7b-instruct-q4_k_m}
      context-size: ${LLM_CONTEXT_SIZE:16384}
      max-tokens: ${LLM_MAX_TOKENS:2048}
      temperature: ${LLM_TEMPERATURE:0.7}
      top-p: ${LLM_TOP_P:0.9}
      top-k: ${LLM_TOP_K:40}
      repeat-penalty: ${LLM_REPEAT_PENALTY:1.1}
  glm47:
    enabled: ${GLM47_ENABLED:true}
    api-key: ${GLM47_API_KEY:}
    base-url: ${GLM47_BASE_URL:https://api.z.ai/api/paas/v4}
    model: ${GLM47_MODEL:glm-4.7}
    timeout: ${GLM47_TIMEOUT:120000}
    max-retries: ${GLM47_MAX_RETRIES:3}
    chat:
      options:
        temperature: ${GLM47_TEMPERATURE:1.0}
        top-p: ${GLM47_TOP_P:0.95}
        max-tokens: ${GLM47_MAX_TOKENS:131072}
    thinking:
      enabled: ${GLM47_THINKING_ENABLED:true}
      preserved: ${GLM47_PRESERVED_THINKING:true}
  km-bert:
    enabled: ${KM_BERT_ENABLED:true}
    api-key: ${KM_BERT_API_KEY:}
    base-url: ${KM_BERT_BASE_URL:https://router.huggingface.co/hf-inference/models/madatnlp/km-bert}
    timeout: ${KM_BERT_TIMEOUT:10000}
    max-retries: ${KM_BERT_MAX_RETRIES:3}
    use-for-preprocessing: ${KM_BERT_USE_FOR_PREPROCESSING:true}
  cache:
    enabled: ${LLM_CACHE_ENABLED:true}
    ttl: ${LLM_CACHE_TTL:3600}
  rate-limit:
    enabled: ${LLM_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${LLM_RATE_LIMIT_RPM:30}
    requests-per-hour: ${LLM_RATE_LIMIT_RPH:500}

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
