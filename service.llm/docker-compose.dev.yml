version: '3.8'

# 개발 환경용 Docker Compose (로컬 개발 시 사용)

services:
  # llama.cpp 서버 (LLM 모델 실행)
  llama-cpp-server:
    image: ghcr.io/ggerganov/llama.cpp:server-latest
    container_name: llama-cpp-server-dev
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      - MODEL=/models/qwen2.5-7b-instruct-q4_k_m.gguf
      - CTX_SIZE=16384
      - THREADS=8
      - N_GPU_LAYERS=0  # CPU 모드 (GPU 사용 시 35로 변경)
    command: >
      --model ${MODEL}
      --port 8080
      --ctx-size ${CTX_SIZE}
      --threads ${THREADS}
      --n-gpu-layers ${N_GPU_LAYERS}
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Redis (캐시 및 대화 히스토리)
  redis:
    image: redis:7-alpine
    container_name: llm-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data-dev:

