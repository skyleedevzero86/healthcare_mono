version: "3.8"

services:
  llama-cpp-server:
    image: ghcr.io/ggerganov/llama.cpp:server-latest
    container_name: llama-cpp-server-dev
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models
    environment:
      - MODEL=/models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
      - CTX_SIZE=16384
      - THREADS=8
      - N_GPU_LAYERS=0
    command: >
      --model ${MODEL}
      --port 8090
      --ctx-size ${CTX_SIZE}
      --threads ${THREADS}
      --n-gpu-layers ${N_GPU_LAYERS}
      --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
