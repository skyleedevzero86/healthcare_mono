version: "3.8"

# 개발 환경용 Docker Compose - llama.cpp 서버만 실행
# 사용법: docker-compose -f docker-compose.dev.yml up -d
# 중지: docker-compose -f docker-compose.dev.yml down

services:
  # llama.cpp 서버 (LLM 모델 실행)
  llama-cpp-server:
    image: ghcr.io/ggerganov/llama.cpp:server-latest
    container_name: llama-cpp-server-dev
    ports:
      - "8090:8090" # 다른 서비스와 겹치지 않는 포트 사용 (api.gateway: 8080, service.auth: 8082, service.comm: 8085, service.healthcare: 8084, service.llm: 8086, service.usermanagement: 8087)
    volumes:
      - ./models:/models
    environment:
      - MODEL=/models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
      - CTX_SIZE=16384
      - THREADS=8
      - N_GPU_LAYERS=0 # CPU 모드 (GPU 사용 시 35로 변경)
    command: >
      --model ${MODEL}
      --port 8090
      --ctx-size ${CTX_SIZE}
      --threads ${THREADS}
      --n-gpu-layers ${N_GPU_LAYERS}
      --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
