version: "3.8"

services:
  service-discovery:
    image: service.discovery:latest
    container_name: service-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-config:
    image: service.config:latest
    container_name: service-config
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  api-gateway:
    image: api.gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-auth:
    image: service.auth:latest
    container_name: service-auth
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-comm:
    image: service.comm:latest
    container_name: service-comm
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-healthcare:
    image: service.healthcare:latest
    container_name: service-healthcare
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-usermanagement:
    image: service.usermanagement:latest
    container_name: service-usermanagement
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  service-llm:
    image: service.llm:latest
    container_name: service-llm
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  web-healthcare:
    image: web.healthcare:latest
    container_name: web-healthcare
    ports:
      - "8981:8981"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - service-discovery
      - service-config
      - api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8981/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge

