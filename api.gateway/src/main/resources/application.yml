server:
  port: 8080
  max-http-header-size: 16KB
  max-http-post-size: 10MB

spring:
  config:
    import: configserver:http://localhost:8888
  application:
    name: api.gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:8981"
              - "http://localhost:19006"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-connections: 500
          max-idle-time: 30s
          routes:
        - id: auth-service
          uri: lb://service.auth
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            - StripPrefix=0
          order: 1
        - id: healthcare-service
              uri: lb://service.healthcare
              predicates:
                - Path=/healthcare/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,INTERNAL_SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          order: 2
        - id: community-service
          uri: lb://service.comm
          predicates:
            - Path=/community/**
          filters:
            - StripPrefix=0
          order: 3
        - id: usermanagement-service
              uri: lb://service.usermanagement
              predicates:
                - Path=/management/**
          filters:
            - StripPrefix=0
          order: 4
        - id: web-healthcare-service
          uri: http://localhost:8981
              predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1
          order: 5
      default-filters:
        - name: GlobalLoggingFilter
          args:
            baseMessage: "API Gateway Request"
            preLogger: true
            postLogger: true
          discovery:
            locator:
              enabled: true
          lower-case-service-id: true
    config:
      uri: http://localhost:8888
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  profiles:
    active: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.sleekydz86: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
