server:
  port: 8084
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10

spring:
  application:
    name: service.healthcare
  profiles:
    active: dev
    include: common

  config:
    import: optional:configserver:http://localhost:8888

  mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.sleekydz86.service.healthcare.dto
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
      default-statement-timeout: 30

  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,loggers,circuitbreakers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

spring:
  sleuth:
    zipkin:
      base-url: http://localhost:9411
    sampler:
      probability: 1.0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

logging:
  config: classpath:log4j2-spring.xml

info:
  app:
    name: healthcare_mono Core Service
    description: Healthcare LifeLink Core Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}

chatgpt:
  enabled: ${CHATGPT_ENABLED:false}
  api:
    url: ${CHATGPT_API_URL:https://api.openai.com/v1/chat/completions}
    key: ${CHATGPT_API_KEY:}

sharding:
  datasource:
    ds0:
      url: ${SHARDING_DS0_URL:jdbc:postgresql://shard0-db:5432/healthcare}
    ds1:
      url: ${SHARDING_DS1_URL:jdbc:postgresql://shard1-db:5432/healthcare}
    ds2:
      url: ${SHARDING_DS2_URL:jdbc:postgresql://shard2-db:5432/healthcare}
    ds3:
      url: ${SHARDING_DS3_URL:jdbc:postgresql://shard3-db:5432/healthcare}
    username: ${SHARDING_DATASOURCE_USERNAME:healthcare_user}
    password: ${SHARDING_DATASOURCE_PASSWORD:healthcare_pass}
    maximum-pool-size: ${SHARDING_DATASOURCE_MAX_POOL_SIZE:20}
    minimum-idle: ${SHARDING_DATASOURCE_MIN_IDLE:5}