server:
  port: 8443
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10
  ssl:
    enabled: true
    key-store: classpath:keystore/healthcare-keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:healthcare_ssl_2025}
    key-store-type: PKCS12
    key-alias: healthcare
    trust-store: classpath:keystore/healthcare-truststore.p12
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:healthcare_trust_2025}
    trust-store-type: PKCS12
  http2:
    enabled: true

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/healthcare_prod?ssl=true&sslmode=require
    username: ${DB_USERNAME:healthcare_user}
    password: ${DB_PASSWORD:healthcare_pass}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        ssl: true
        sslmode: require
        sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 운영 환경 로깅
logging:
  level:
    root: WARN
    com.sleekydz86: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# 운영용 설정
debug: false

encryption:
  aes:
    key: ${AES_ENCRYPTION_KEY}
    iv: ${AES_IV}
  jwt:
    secret: ${JWT_SECRET}