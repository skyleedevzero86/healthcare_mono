spring:
  application:
    name: web.healthcare
  profiles:
    active: dev

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
    static-path-pattern: /static/**

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:src/main/webapp/
      cache:
        period: 3600

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: Asia/Seoul

  mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.sleekydz86.web.dto
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
      default-statement-timeout: 30

  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      password: ${SECURITY_USER_PASSWORD:}
      roles: ${SECURITY_USER_ROLES:ADMIN}

  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${imgPath}

  cache:
    type: simple
    cache-names:
      - userCache
      - healthcareCache

  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600

gateway:
  version: /v1
  auth:
    uri: http://localhost:8082
  healthcare:
    uri: http://localhost:8081
  usermanagement:
    uri: http://localhost:8086
  community:
    uri: http://localhost:8085

request:
  timeout: 30

token:
  secret: healthcare-lifelink-jwt-secret-key-for-authentication-service-2025-dev
  access-expired-time: 3600000
  refresh-expired-time: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

spring:
  sleuth:
    zipkin:
      base-url: http://localhost:9411
    sampler:
      probability: 1.0

logging:
  config: classpath:log4j2-spring.xml
  level:
    root: INFO
    com.sleekydz86: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG

info:
  app:
    name: Healthcare Web Application
    description: Healthcare LifeLink Web Frontend
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}

imgPath: C:/healthcare/images
imgTmp: C:/healthcare/tmp